name: Release Please

on:
  push:
    branches: ["main"]

# Least privilege at the top level; jobs opt into more as needed
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases and tags
      pull-requests: write # create and update the release PR
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Releases created by release-please use the workflow's GITHUB_TOKEN, which
  # deliberately does not trigger `release:` workflows — so publishing and docs
  # deployment are chained here explicitly instead.
  #
  # npm Trusted Publishing only accepts the workflow a run was started from, so
  # publish.yml is dispatched as its own run instead of being called from here.
  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch publish.yml
    steps:
      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG_NAME"

  deploy-docs:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    uses: ./.github/workflows/deploy-docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
